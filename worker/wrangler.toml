name = "hancock-agent"
main = "src/index.js"
compatibility_date = "2026-02-04"

# Cron triggers - heartbeat every 4 hours + weekly digest Monday 2pm UTC (9am ET)
#
# ⏸ PAUSED September 8, 2026. Empty list = no scheduled runs. The worker stays
# deployed and every HTTP endpoint keeps answering (/health, /state, /report,
# /submissions, manual /heartbeat, /crosspost). Only the autonomous cycle stops:
# no crossposts, no originals, no comments, no weekly digest.
#
# TO RESUME: restore the line below and push. CI redeploys.
#   crons = ["0 */4 * * *", "0 14 * * 1"]
#
# Why paused: running unattended while an identity remediation is still open is
# the one configuration with real downside. Cost was never the reason — this
# runs on free tier.
[triggers]
crons = []

# Workers AI binding
[ai]
binding = "AI"

# Environment variables (secrets set via wrangler secret put)
# MOLTBOOK_API_KEY - set via: npx wrangler secret put MOLTBOOK_API_KEY
# GITHUB_PAT - set via: npx wrangler secret put GITHUB_PAT (for auto-promote to site)

# KV namespace for state (last check timestamp, etc.)
[[kv_namespaces]]
binding = "HANCOCK_STATE"
id = "1a937f2cb3f04f969cb5b92bc1c42b62"

# Outbound email via Cloudflare Email Routing.
# Used to notify the operator when a submission lands at hancock.us.com/submit.
# Sender domain (hancock.us.com) must have Email Routing enabled in Cloudflare.
# destination_address is the only verified recipient — for submitter-side
# confirmation emails to arbitrary addresses, use Resend (RESEND_API_KEY).
[[send_email]]
name = "SEND_EMAIL"
destination_address = "hancock8@proton.me"
